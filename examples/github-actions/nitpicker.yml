# Copy to your repo as .github/workflows/nitpicker.yml
# Then add repo/org secret: LLM_API_KEY
#
# Optional repo variables:
#   AI_PROVIDER  (anthropic | openai | google)
#   AI_MODEL
#   BOT_NAME     (default github-actions — mention @github-actions for Q&A)
#
# Reviews post as github-actions[bot] unless you pass a PAT via github-token.

name: Nitpicker

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (contains(github.event.comment.body, '/nitpicker') ||
         contains(github.event.comment.body, '@github-actions'))) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@github-actions'))
    runs-on: ubuntu-latest
    steps:
      - name: Nitpicker
        uses: sagivo/nitpicker@main
        with:
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          ai-provider: ${{ vars.AI_PROVIDER || 'anthropic' }}
          ai-model: ${{ vars.AI_MODEL || 'claude-sonnet-5' }}
          bot-name: ${{ vars.BOT_NAME || 'github-actions' }}
          review-on-open: ${{ vars.REVIEW_ON_OPEN || 'true' }}
